    <script>
      (function() {
        try {
          const theme = localStorage.getItem('efa_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 dark:bg-[#0F172A] dark:text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950 transition-colors duration-300">
